[project]
name = "sap-integration-agent"
version = "0.1.0"
description = "Approval-gated SAP Integration Suite DEV agent"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic-settings>=2.7,<3", "mcp>=1.12,<2", "defusedxml>=0.7,<1"]
[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
